name: Windows PCNTL extension

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: PHP ${{ matrix.php }} / ${{ matrix.ts }} / ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        ts: ['nts', 'ts']
        arch: ['x64', 'x86']
    steps:
      - uses: actions/checkout@v5
      - uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          args: --enable-pcntl
          auth-token: ${{ github.token }}
          run-tests: 'true'
