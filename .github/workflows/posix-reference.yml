name: POSIX reference conformance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl, posix
          coverage: none
      - name: Inspect installed PCNTL
        run: |
          php tools/posix-capabilities.php
          php -r 'if (!extension_loaded("pcntl")) exit(1);'
      - name: Validate real POSIX fork and exec
        run: php tests/reference/fork-exec.php
      - name: Validate nested fork and copied PHP resources
        run: php tests/reference/fork-matrix.php
      - name: Inspect Linux namespace support
        run: php tests/reference/linux-namespace-probe.php
      - name: Validate real unshare and setns with privilege when available
        run: sudo -E "$(command -v php)" tests/reference/linux-namespace-conformance.php
