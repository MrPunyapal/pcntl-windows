name: Solaris PCNTL forkx reference
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solaris-reference.yml'
      - 'tests/reference/forkx.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  solaris:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: php/php-src
          ref: PHP-8.4
          path: upstream/php-src
      - name: Build real Solaris PHP with PCNTL and test forkx
        uses: vmactions/solaris-vm@v1
        with:
          release: '11.4-gcc'
          sync: rsync
          copyback: false
          prepare: |
            pkg install bison re2c
            cd upstream/php-src
            ./buildconf -f
            CC=gcc CXX=g++ PATH=/usr/gnu/bin:/usr/bin ./configure --disable-all --enable-cli --disable-cgi --disable-phpdbg --enable-pcntl --without-pear
            gmake -j2
          run: |
            upstream/php-src/sapi/cli/php -n -v
            upstream/php-src/sapi/cli/php -n tools/posix-capabilities.php
            upstream/php-src/sapi/cli/php -n tests/reference/forkx.php
