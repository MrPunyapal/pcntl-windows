name: Build PIE Windows releases

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    name: Validate PIE metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
      - run: composer validate --no-check-publish

  windows:
    name: PHP ${{ matrix.php }} / ${{ matrix.ts }} / ${{ matrix.arch }}
    needs: manifest
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        ts: ['nts', 'ts']
        arch: ['x64', 'x86']
    steps:
      - uses: actions/checkout@v5
      - uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          args: --enable-pcntl
          auth-token: ${{ github.token }}
          run-tests: 'true'

  release:
    name: Stage draft release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: php/php-windows-builder/release@v1
        with:
          release: ${{ github.ref_name }}
          token: ${{ github.token }}
          draft: 'true'
