name: macOS PCNTL native QoS reference
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos-reference.yml'
      - 'tests/reference/darwin-qos.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl
          coverage: none
      - name: Test Darwin QoS
        run: |
          php tools/posix-capabilities.php
          php tests/reference/darwin-qos.php
