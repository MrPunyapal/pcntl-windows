name: Cygwin PHP native fork research
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cygwin-reference.yml'
      - 'tools/build-cygwin-php.sh'
      - '.gitattributes'
      - 'tests/reference/fork-exec.php'
      - 'tests/reference/fixtures/exec-child.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cygwin:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - name: Configure LF-only checkout for upstream PHP Unix build scripts
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          repository: php/php-src
          ref: PHP-8.5
          path: upstream/php-src
      - name: Install POSIX build dependencies under Cygwin
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://cygwin.com/setup-x86_64.exe' -OutFile "$env:RUNNER_TEMP\setup-x86_64.exe"
          $packages = 'gcc-core,gcc-g++,python3,curl,make,autoconf,automake,libtool,git,bison,libxml2-devel,libpcre2-devel,libsqlite3-devel,pkg-config,libiconv-devel,zlib-devel'
          $cache = Join-Path $env:RUNNER_TEMP 'cygwin-cache'
          New-Item -Path $cache -ItemType Directory -Force | Out-Null
          # Cygwin setup is a GUI-subsystem executable: PowerShell call operator
          # may return before installation completes. Wait for the full process tree.
          $installArgs = "--quiet-mode --no-admin --no-shortcuts --no-startmenu --no-desktop --only-site --root C:\cygwin64 --local-package-dir $cache --site https://mirrors.kernel.org/sourceware/cygwin/ --packages $packages"
          $installer = Start-Process -FilePath "$env:RUNNER_TEMP\setup-x86_64.exe" -ArgumentList $installArgs -Wait -PassThru
          if ($installer.ExitCode -ne 0) { exit $installer.ExitCode }
          if (-not (Test-Path 'C:\cygwin64\bin\bash.exe')) {
            throw 'Cygwin installer did not create the bash binary. Check package installation and setup.log.'
          }
      - name: Build Cygwin-linked PHP and run real PCNTL fork/exec tests
        shell: pwsh
        run: |
          & 'C:\cygwin64\bin\bash.exe' -l -c 'bash "$(cygpath -u "$GITHUB_WORKSPACE")/tools/build-cygwin-php.sh"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
