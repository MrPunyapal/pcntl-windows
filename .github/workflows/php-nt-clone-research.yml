name: UNSAFE native PHP NT clone experiment
# Intentionally manual-only. The known PHP VM cloning experiment hangs in
# the child despite reaching the native clone return point. This is not a CI
# gate for the supported Windows extension.
on:
  workflow_dispatch:
    inputs:
      pin_module:
        description: 'Isolated hypothesis: pin the cloned extension to avoid module unmapping'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  php-nt-clone:
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      PCNTL_UNSAFE_CLONE_TEST: '1'
      PCNTL_UNSAFE_CLONE_PIN_MODULE: ${{ inputs.pin_module && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - name: Capture crash dumps for isolated PHP processes
        shell: pwsh
        run: |
          $dumpFolder = Join-Path $env:GITHUB_WORKSPACE 'clone-crashes'
          New-Item -ItemType Directory -Path $dumpFolder -Force | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\php.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumpFolder -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
      - uses: php/php-windows-builder/extension@v1
        with:
          php-version: '8.5'
          arch: x64
          ts: nts
          args: --enable-pcntl --enable-pcntl-unsafe-clone
          auth-token: ${{ github.token }}
          run-tests: 'true'
      - name: Preserve negative results and native child dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsafe-clone-diagnostics
          path: |
            clone-crashes/*.dmp
            build/**/pcntl-clone-child.dmp
            build/**/*.out
            build/**/*.diff
            build/**/*.log
          if-no-files-found: warn
          retention-days: 7
